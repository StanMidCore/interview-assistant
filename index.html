<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Interview Assistant (Claude)</title>
   <style>
       :root {
           --bg-color: #191919;
           --panel-bg: #222222;
           --text-color: #e0e0e0;
           --accent-color: #f19a3e; /* Couleur Anthropic */
           --accent-green: #a6e3a1;
           --border-color: #333333;
       }

       body {
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
           background-color: var(--bg-color);
           color: var(--text-color);
           margin: 0;
           padding: 15px;
           display: flex;
           flex-direction: column;
           height: 100vh;
           box-sizing: border-box;
       }

       .header {
           display: flex;
           justify-content: space-between;
           align-items: center;
           margin-bottom: 10px;
           padding-bottom: 10px;
           border-bottom: 1px solid var(--border-color);
       }

       .title {
           font-size: 1.2rem;
           font-weight: bold;
           color: var(--accent-color);
       }

       .config-box {
           display: flex;
           gap: 10px;
       }

       input[type="password"] {
           background: var(--panel-bg);
           border: 1px solid var(--border-color);
           color: white;
           padding: 5px 10px;
           border-radius: 5px;
           font-size: 0.85rem;
           width: 250px;
       }

       .main-layout {
           display: grid;
           grid-template-columns: 340px 1fr;
           gap: 15px;
           flex-grow: 1;
           min-height: 0;
       }

       .left-column {
           display: flex;
           flex-direction: column;
           gap: 15px;
       }

       .panel {
           background-color: var(--panel-bg);
           border: 1px solid var(--border-color);
           border-radius: 8px;
           padding: 15px;
           display: flex;
           flex-direction: column;
           min-height: 0;
       }

       .panel-title {
           font-size: 0.9rem;
           text-transform: uppercase;
           letter-spacing: 1px;
           margin-bottom: 10px;
           color: var(--accent-color);
           font-weight: bold;
       }

       textarea {
           width: 100%;
           flex-grow: 1;
           background-color: var(--bg-color);
           border: 1px solid var(--border-color);
           color: var(--text-color);
           padding: 10px;
           border-radius: 5px;
           resize: none;
           box-sizing: border-box;
           font-size: 0.9rem;
           line-height: 1.4;
       }

       .btn {
           background-color: var(--accent-color);
           color: #11111b;
           border: none;
           padding: 10px 15px;
           border-radius: 5px;
           font-weight: bold;
           cursor: pointer;
           transition: opacity 0.2s;
       }

       .btn:hover {
           opacity: 0.9;
       }

       .btn-listen {
           background-color: var(--accent-green);
           margin-top: 10px;
           width: 100%;
       }

       .btn-listen.active {
           background-color: #f38ba8;
           animation: pulse 1.5s infinite;
       }

       .right-column {
           display: flex;
           flex-direction: column;
           gap: 15px;
           min-height: 0;
       }

       .feed-container {
           flex-grow: 1;
           overflow-y: auto;
           display: flex;
           flex-direction: column;
           gap: 10px;
           padding-right: 5px;
       }

       .message-block {
           background-color: var(--panel-bg);
           border: 1px solid var(--border-color);
           border-radius: 8px;
           padding: 15px;
       }

       .question-label {
           color: #f38ba8;
           font-weight: bold;
           font-size: 0.85rem;
           margin-bottom: 5px;
       }

       .suggestion-label {
           color: var(--accent-green);
           font-weight: bold;
           font-size: 0.85rem;
           margin-top: 10px;
           margin-bottom: 5px;
           border-top: 1px dashed var(--border-color);
           padding-top: 8px;
       }

       .text-content {
           font-size: 0.95rem;
           line-height: 1.5;
           white-space: pre-wrap;
       }

       .plan-main {
           font-size: 1.15rem;
           font-weight: bold;
           color: #ffffff;
           margin-top: 12px;
           line-height: 1.4;
       }
       .plan-main:first-child { margin-top: 0; }
       .plan-sub {
           font-size: 0.95rem;
           color: #bac2de;
           margin-left: 22px;
           margin-top: 3px;
       }
       .suggestion-text { white-space: normal; }
       .b1 { font-size: 1.25rem; font-weight: bold; color: #fff; line-height: 1.45; margin: 14px 0 6px; padding-left: 18px; text-indent: -18px; }
       .b1:first-child { margin-top: 0; }
       .b1::before { content: "• "; color: var(--accent-color); }
       .b2 { font-size: 1.05rem; color: #cdd6f4; margin: 4px 0 2px 26px; padding-left: 16px; text-indent: -16px; }
       .b2::before { content: "◦ "; color: var(--accent-green); }
       .b3 { font-size: 0.98rem; color: #bac2de; margin: 2px 0 2px 52px; padding-left: 14px; text-indent: -14px; }
       .b3::before { content: "– "; color: #6c7086; }
       .answer-par {
           font-size: 1.25rem;
           line-height: 1.65;
           color: #ffffff;
           margin: 0 0 14px 0;
       }

       .ignored-line {
           font-size: 0.8rem;
           color: #6c7086;
           font-style: italic;
           padding: 2px 4px;
       }

       .btn-confirm {
           font-style: normal;
           font-size: 0.75rem;
           margin-left: 6px;
           padding: 2px 8px;
           border-radius: 4px;
           border: 1px solid var(--accent-green);
           background: transparent;
           color: var(--accent-green);
           cursor: pointer;
       }
       .btn-confirm:hover { background: var(--accent-green); color: #11111b; }

       .live-transcript {
           font-style: italic;
           color: #a6adc8;
           margin-top: 5px;
           font-size: 0.9rem;
       }

       @keyframes pulse {
           0% { opacity: 1; }
           50% { opacity: 0.6; }
           100% { opacity: 1; }
       }
       .voice-box { font-size: 0.8rem; color: #a6adc8; margin-top: 8px; text-align: center; }
       .voice-box input { width: 100%; }
       .right-column { position: relative; }
       .new-btn { display: none; position: absolute; right: 24px; bottom: 60px; z-index: 5; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
       .mobile-only { display: none; }
       .btn-setup { background: #333; color: #e0e0e0; padding: 6px 12px; }

       /* ===== Téléphone : seule la réponse compte ===== */
       @media (max-width: 820px) {
           body { height: 100vh; height: 100dvh; padding: 8px; }
           .header { flex-wrap: wrap; gap: 8px; margin-bottom: 8px; padding-bottom: 8px; }
           .title { font-size: 1rem; }
           .mobile-only { display: inline-block; }
           .config-box, .setup-panel { display: none !important; }
           body.show-setup .config-box { display: flex !important; width: 100%; }
           body.show-setup .setup-panel { display: flex !important; height: auto !important; }
           body.show-setup .setup-panel textarea { min-height: 140px; }
           input[type="password"] { width: 100%; flex: 1; }
           .main-layout { display: flex; flex-direction: column; gap: 8px; }
           .left-column { gap: 8px; }
           .mic-panel { height: auto !important; padding: 10px; }
           .mic-panel .panel-title { display: none; }
           .btn-listen { margin-top: 0; padding: 14px; font-size: 1rem; }
           .right-column { flex: 1; min-height: 0; padding: 10px; }
           .right-column > .panel-title { display: none; }
           .message-block { padding: 10px; }
           .answer-par { font-size: 1.15rem; line-height: 1.55; }
           .b1 { font-size: 1.1rem; } .b2 { margin-left: 14px; } .b3 { margin-left: 30px; }
       }
   </style>
</head>
<body>

   <div class="header">
       <div class="title">Interview Assistant (Claude)</div>
       <button class="btn btn-setup mobile-only" onclick="document.body.classList.toggle('show-setup')">⚙ Setup</button>
       <div class="config-box">
           <input type="password" id="apiKey" placeholder="Anthropic API key (sk-ant-...)" />
           <button class="btn" onclick="saveKey()">Save</button>
       </div>
   </div>

   <div class="main-layout">
       <!-- Colonne Gauche : Contextes et Contrôles -->
       <div class="left-column">
           <div class="panel setup-panel" style="height: 40%;">
               <div class="panel-title">1. Job Description</div>
               <textarea id="jobDescription" placeholder="Paste the job posting or role context..."></textarea>
           </div>

           <div class="panel setup-panel" style="height: 40%;">
               <div class="panel-title">2. Your Resume (built in)</div>
               <textarea id="userResume" placeholder="Paste your resume, experience or key skills to highlight..."></textarea>
           </div>

           <div class="panel mic-panel" style="height: 20%; justify-content: center;">
               <div class="panel-title">Microphone</div>
               <button id="listenBtn" class="btn btn-listen" onclick="toggleListening()">Start Listening</button>
               <div id="liveStatus" class="live-transcript" style="text-align: center; margin-top: 5px;">Mic off</div>
               <div class="voice-box">
                   <div>Interviewer voice if above <b id="thrVal">165</b> Hz
                       <input type="range" id="thr" min="120" max="230" value="165" oninput="setThreshold(this.value)"></div>
                   <div>Last voice heard: <b id="lastPitch">–</b></div>
               </div>
           </div>
       </div>

       <!-- Colonne Droite : Transcription et Suggestions en continu -->
       <div class="panel right-column">
           <div class="panel-title">Questions & Suggested Answers</div>
           <button id="newBtn" class="btn new-btn" onclick="jumpToLatest()">↓ New answer</button>
           <div class="feed-container" id="feedContainer">
               <!-- Les blocs s'ajoutent ici dynamiquement -->
           </div>
           <div id="currentTranscription" class="live-transcript" style="border-top: 1px solid var(--border-color); padding-top: 10px;">
               <strong>Listening:</strong> <span id="interimText">...</span>
           </div>
       </div>
   </div>

   <script>
       let recognition;
       let isListening = false;
       let silenceTimer = null;
       let history = []; // derniers propos entendus, pour le contexte

       // Récupérer les données stockées au chargement
       document.getElementById('apiKey').value = localStorage.getItem('anthropic_key') || '';
       document.getElementById('jobDescription').value = localStorage.getItem('anthropic_job_desc') || '';
       // CV intégré de façon permanente (modifiable dans la case pour la session en cours)
       const BUILT_IN_RESUME = "Stanislas de Quénetain\nFinancial Lawyer — Investment Funds, Asset Management & Regulatory Compliance\nParis (remote)\nUCITS · AIFMD · Fund documentation · AMF / CSSF · AML/CFT · MiCA · ISDA / GMRA / GMSLA\n\nPROFILE\nFinancial lawyer with 15+ years in investment funds, asset management and capital markets, built at Goldman Sachs, JPMorgan, RBS, CACEIS and Natixis, and in regulated asset managers and crypto-asset service providers.\n- Fund documentation: led legal and regulatory documentation for UCITS and AIFs in France and Luxembourg (prospectuses, KIID / PRIIPs KID, fund regulations, SICAV articles, depositary and delegation agreements) with AMF and CSSF filings.\n- Asset-manager compliance: Chief Compliance Officer and co-founder of AMF-registered entities; designed and ran full compliance and AML/CFT programmes; currently Head of Compliance & Internal Control at an asset manager.\n- Securities regulation: AIFMD, UCITS, MiFID II, EMIR, SFTR, PRIIPs, FATCA, AMF General Regulation, MiCA.\n- Fund counterparties: negotiated trading, prime brokerage and financing documentation for hedge funds, SICAV / FCP, OEICs, unit trusts and Cayman / US / EU funds.\n- AI & fintech: builds AI-assisted legal and compliance workflows; hands-on with digital-asset regulation and on-chain compliance tooling.\nBilingual French / English (9 years in London). Available for remote contract work.\n\nEXPERIENCE\nMelanion Capital — Head of Compliance & Internal Control (RCCI) · Paris · Jun 2026 – present\n- Compliance and internal-control function of an AMF-authorised asset manager: compliance monitoring plan, controls, regulatory reporting and liaison with the AMF.\n- Oversight of fund-level compliance (UCITS / AIF rules), AML/CFT and conflicts-of-interest framework.\n\nNatixis — VP, Legal & Compliance · Paris · Apr 2024 – Jun 2026\n- Negotiated ISDA / CSA, GMRA, GMSLA and FBF agreements with asset managers, funds and institutional counterparties.\n- Drafted and reviewed private-debt documentation: facility, security, intercreditor and subordination agreements.\n- Contributed to the compliance framework and regulatory monitoring for capital-markets activities.\n\nCryptoSure — Chief Compliance Officer · Paris · Dec 2021 – Apr 2024\n- Built the full compliance programme of an AMF-registered asset manager / digital-asset service provider (PSAN): policies, procedures, controls and AMF relationship.\n- Ran AML/CFT, KYC/KYB and transaction monitoring; tracked MiCA and FATF developments and adapted the framework.\n\nYUZU — Co-Founder & Chief Compliance Officer · Paris · Dec 2021 – Mar 2023\n- Led the PSAN registration with the AMF; designed KYC / KYB / KYT and on-chain monitoring processes.\n\nCACEIS Bank — Head of Capital Markets Legal · Paris · Jul 2017 – Dec 2021\n- Led legal and regulatory documentation for UCITS and AIFs in France and Luxembourg: prospectuses, KIID / PRIIPs KID, fund regulations, SICAV articles of association, depositary and delegation agreements.\n- Handled AMF and CSSF regulatory filings and approvals for fund launches and changes.\n- Advised on AIFMD, UCITS, MiFID II, EMIR and SFTR; sat on compliance committees; managed a four-person legal team.\n\nJ.P. Morgan — Vice President, Legal · London · Jul 2014 – Jul 2017\n- Negotiated prime brokerage, clearing, execution, F&O and ISDA / CSA documentation for hedge funds and asset managers.\n- Advised on EMIR and FATCA implementation for fund clients.\n\nGoldman Sachs International — Legal Counsel · London · Aug 2010 – Mar 2013\n- Negotiated ISDA / CSA with Luxembourg and French SICAV / FCP, UK unit trusts and OEICs, and Cayman, US and EU hedge funds.\n- Main legal contact for French and UK asset managers; built and trained a three-person team in Bangalore.\n\nRoyal Bank of Scotland — Legal Counsel · London · Jul 2008 – Aug 2010\n- Documented trading relationships with pension funds, hedge funds and limited partnerships (UK, US, Cayman); drafted fund lifecycle documents (novations, confidentiality, terminations).\n\nEDUCATION & CERTIFICATIONS\n- AMF Professional Certification — 2021\n- AML/CFT Certification — KPMG, 2022\n- ESSEC Business School — Master in International Business Law & Management, 2004–05 (Merit). Thesis on hedge-fund structures under the French UCITS framework (OPCVM ARIA).\n- Université Paris XI — Master in European Business Law & Finance, 2003–04 (Merit)\n- Université Paris II Panthéon-Assas — Bachelor of Laws, 2002–03 (Erasmus, Warsaw)\n- Fudan University, Shanghai — Chinese language programme, 2013\n\nSKILLS & LANGUAGES\n- Investment funds & asset management law: UCITS, AIFMD, SICAV / FCP, Luxembourg funds, fund regulations and prospectuses, depositary and delegation agreements, PRIIPs KID.\n- Securities regulation & compliance: MiFID II, EMIR, SFTR, AMF General Regulation, CSSF, FATCA, AML/CFT, MiCA; compliance monitoring plans and internal control.\n- Legal drafting & review: fund documentation, ISDA / CSA, GMRA, GMSLA, prime brokerage, facility and security agreements.\n- Regulatory research & filings: AMF and CSSF filings, regulatory change analysis, PSAN registration.\n- Fintech & AI: digital-asset compliance (KYC / KYB / KYT, on-chain analytics); designs AI-assisted legal and compliance workflows.\n- Languages: French (native), English (fluent, 9 years in London), Chinese (basic).";
       document.getElementById('userResume').value = BUILT_IN_RESUME;

       function saveKey() {
           localStorage.setItem('anthropic_key', document.getElementById('apiKey').value);
           localStorage.setItem('anthropic_job_desc', document.getElementById('jobDescription').value);
           alert('Settings and texts saved in this browser.');
       }

       // Initialisation de la reconnaissance vocale
       if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
           const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
           recognition = new SpeechRecognition();
           recognition.continuous = true;
           recognition.interimResults = true;
           recognition.lang = 'en-US';

           recognition.onresult = function(event) {
               let interimTranscript = '';
               let finalTranscript = '';

               for (let i = event.resultIndex; i < event.results.length; ++i) {
                   if (event.results[i].isFinal) {
                       finalTranscript += event.results[i][0].transcript;
                   } else {
                       interimTranscript += event.results[i][0].transcript;
                   }
               }

               if (interimTranscript) {
                   document.getElementById('interimText').innerText = interimTranscript;
                   // Si plus rien ne bouge pendant 1,5 s, on force la fin de phrase
                   clearTimeout(silenceTimer);
                   silenceTimer = setTimeout(function() {
                       try { recognition.stop(); } catch (e) {}
                   }, 1500);
               }

               if (finalTranscript) {
                   clearTimeout(silenceTimer);
                   document.getElementById('interimText').innerText = '...';
                   handleUtterance(finalTranscript.trim());
               }
           };

           recognition.onerror = function(event) {
               console.error("Erreur Speech : ", event.error);
               if (['not-allowed', 'service-not-allowed', 'audio-capture'].indexOf(event.error) !== -1) {
                   isListening = false;
                   const btn = document.getElementById('listenBtn');
                   btn.innerText = "Start Listening";
                   btn.classList.remove('active');
                   document.getElementById('liveStatus').innerText =
                       "⚠️ Mic blocked (" + event.error + "). On iPhone: enable Dictation and allow the microphone, then tap Start.";
               }
           };

           recognition.onend = function() {
               // Relance automatique de l'écoute pour la question suivante
               if (isListening) {
                   setTimeout(function() {
                       if (!isListening) return;
                       try { recognition.start(); } catch (e) { console.warn('restart', e); }
                   }, 200);
               }
           };
       } else {
           alert("This browser does not support speech recognition. Use Google Chrome.");
       }

       // Empêche l'écran de se mettre en veille pendant l'écoute (iPhone / Safari récent)
       let wakeLock = null;
       async function keepScreenOn(on) {
           try {
               if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
               if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
           } catch (e) { console.warn('wakeLock', e); }
       }
       document.addEventListener('visibilitychange', function() {
           if (document.visibilityState === 'visible' && isListening) keepScreenOn(true);
       });

       // ===== Reconnaissance de la voix par sa hauteur (Hz) =====
       // Voix féminine ≈ 165–255 Hz, voix masculine ≈ 85–155 Hz
       let threshold = parseInt(localStorage.getItem('voice_thr') || '165', 10);
       document.getElementById('thr').value = threshold;
       document.getElementById('thrVal').innerText = threshold;
       function setThreshold(v) {
           threshold = parseInt(v, 10);
           document.getElementById('thrVal').innerText = threshold;
           try { localStorage.setItem('voice_thr', threshold); } catch (e) {}
       }

       let audioCtx = null, analyser = null, micStream = null, pitchTimer = null;
       let pitchLog = [];          // { t, f0 } mesurés en continu
       let lastUtteranceEnd = Date.now();

       async function startPitch() {
           try {
               micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
               audioCtx = new (window.AudioContext || window.webkitAudioContext)();
               const src = audioCtx.createMediaStreamSource(micStream);
               analyser = audioCtx.createAnalyser();
               analyser.fftSize = 2048;
               src.connect(analyser);
               const buf = new Float32Array(analyser.fftSize);
               pitchTimer = setInterval(function() {
                   analyser.getFloatTimeDomainData(buf);
                   const f0 = detectPitch(buf, audioCtx.sampleRate);
                   if (f0) pitchLog.push({ t: Date.now(), f0: f0 });
                   const cutoff = Date.now() - 60000;
                   while (pitchLog.length && pitchLog[0].t < cutoff) pitchLog.shift();
               }, 40);
           } catch (e) {
               console.warn('pitch', e);
               document.getElementById('lastPitch').innerText = 'unavailable (every sentence will be answered)';
           }
       }
       function stopPitch() {
           clearInterval(pitchTimer); pitchTimer = null;
           if (micStream) micStream.getTracks().forEach(function(t) { t.stop(); });
           if (audioCtx) audioCtx.close();
           micStream = null; audioCtx = null; analyser = null;
       }

       // Détection de la fréquence fondamentale par autocorrélation
       function detectPitch(buf, sr) {
           let rms = 0;
           for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
           rms = Math.sqrt(rms / buf.length);
           if (rms < 0.01) return null;                          // silence
           const minLag = Math.floor(sr / 400), maxLag = Math.floor(sr / 70);
           let best = -1, bestLag = -1;
           for (let lag = minLag; lag <= maxLag; lag++) {
               let sum = 0;
               for (let i = 0; i < buf.length - lag; i++) sum += buf[i] * buf[i + lag];
               if (sum > best) { best = sum; bestLag = lag; }
           }
           let energy = 0;
           for (let i = 0; i < buf.length; i++) energy += buf[i] * buf[i];
           if (bestLag < 0 || best / energy < 0.3) return null;  // pas une voix nette
           return sr / bestLag;
       }

       function median(arr) {
           const s = arr.slice().sort(function(a, b) { return a - b; });
           return s.length ? s[Math.floor(s.length / 2)] : null;
       }

       // À chaque phrase terminée : voix aiguë = interlocutrice → réponse ; voix grave = vous → ignorée
       function handleUtterance(text) {
           const now = Date.now();
           const since = Math.max(lastUtteranceEnd, now - 30000) - 500;
           lastUtteranceEnd = now;
           const f0s = pitchLog.filter(function(p) { return p.t >= since; }).map(function(p) { return p.f0; });
           const m = f0s.length >= 5 ? Math.round(median(f0s)) : null;
           document.getElementById('lastPitch').innerText = m ? (m + ' Hz → ' + (m >= threshold ? 'interviewer' : 'you')) : 'not measured';
           if (m === null || m >= threshold) {
               createDiscussionBlock(text, true);                // on répond
           } else {
               history.push(text);
               showIgnored(text, m + ' Hz, your voice');
           }
       }

       function toggleListening() {
           const btn = document.getElementById('listenBtn');
           const status = document.getElementById('liveStatus');

           if (!isListening) {
               startPitch();
               recognition.start();
               isListening = true;
               keepScreenOn(true);
               btn.innerText = "Stop Listening";
               btn.classList.add('active');
               status.innerText = "🔴 Listening...";
           } else {
               recognition.stop();
               stopPitch();               isListening = false;
               keepScreenOn(false);
               btn.innerText = "Start Listening";
               btn.classList.remove('active');
               status.innerText = "Mic off";
               document.getElementById('interimText').innerText = '...';
           }
       }

       // Pas de défilement automatique : l'utilisateur reste où il est.
       // Si une nouvelle réponse arrive hors de vue, un bouton « New answer » apparaît.
       function notifyNew() {
           const feed = document.getElementById('feedContainer');
           const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
           if (!atBottom) document.getElementById('newBtn').style.display = 'block';
       }
       function jumpToLatest() {
           const feed = document.getElementById('feedContainer');
           const blocks = feed.querySelectorAll('.message-block');
           const last = blocks[blocks.length - 1];
           if (last) last.scrollIntoView({ behavior: 'smooth', block: 'start' });
           document.getElementById('newBtn').style.display = 'none';
       }
       document.addEventListener('DOMContentLoaded', function() {
           document.getElementById('feedContainer').addEventListener('scroll', function() {
               const f = this;
               if (f.scrollHeight - f.scrollTop - f.clientHeight < 40) document.getElementById('newBtn').style.display = 'none';
           });
       });

       // Échappement HTML pour l'affichage sécurisé du texte
       function escapeHtml(str) {
           const div = document.createElement('div');
           div.innerText = str;
           return div.innerHTML;
       }

       // Filtre local : ne garde que ce qui ressemble à une question ou une demande de l'interlocuteur
       const QUESTION_CUES = /\?|\b(what|what's|whats|why|how|how's|which|who|whom|whose|where|when|could you|can you|would you|will you|should you|do you|did you|does|have you|has|are you|were you|is there|is it|is that|tell me|tell us|walk me|walk us|talk me|talk about|describe|explain|give me|give us|share|introduce yourself|imagine|suppose|let's say|lets say|in your opinion|your view|thoughts on)\b/i;
       const SELF_START = /^(so |well |um |uh |er |yeah |yes |no |and |okay |ok |right |sure |honestly |actually )*(i |i'm |im |i've |ive |i'd |i'll |i was |my |me |we |we've |in my |at my |when i |during my )/i;

       function isLikelyQuestion(text) {
           const t = text.trim();
           if (t.split(/\s+/).length < 3) return false;           // trop court
           if (SELF_START.test(t)) return false;                    // le candidat parle de lui
           return QUESTION_CUES.test(t);
       }

       function showIgnored(text, note) {
           const feed = document.getElementById('feedContainer');
           const line = document.createElement('div');
           line.className = 'ignored-line';
           const label = document.createElement('span');
           label.innerText = (note ? 'Ignored (' + note + '): ' : 'Ignored: ') + text + ' ';
           const btn = document.createElement('button');
           btn.className = 'btn-confirm';
           btn.innerText = "✔ It's the interviewer: answer";
           btn.onclick = function() {
               line.remove();
               createDiscussionBlock(text, true);
           };
           line.appendChild(label);
           line.appendChild(btn);
           feed.appendChild(line);
           notifyNew();
       }

       // Crée un bloc question + suggestion dans le fil
       function createDiscussionBlock(question, forced) {
           if (!question) return;
           if (!forced && !isLikelyQuestion(question)) {
               history.push(question);
               showIgnored(question);
               return;
           }
           const feed = document.getElementById('feedContainer');
           const block = document.createElement('div');
           block.className = 'message-block';
           block.innerHTML =
               '<div class="question-label">Question heard:</div>' +
               '<div class="text-content">' + escapeHtml(question) + '</div>' +
               '<div class="suggestion-label">Suggested answer:</div>' +
               '<div class="text-content suggestion-text">⏳ Generating...</div>';
           feed.appendChild(block);
           notifyNew();

           const target = block.querySelector('.suggestion-text');
           const context = history.slice(-5).filter(function(x) { return x !== question; }).slice(-4);
           if (!forced) history.push(question);
           askClaude(question, target, block, context, forced);
       }

       // Mise en forme du plan : lignes « 1. » en gros, sous-points « a. » en retrait
       function renderPlan(text) {
           // Puces imbriquées : niveau 1 = phrase à lire (gros), niveaux 2-3 = éléments pour développer
           return text.split('\n').map(function(line) {
               if (!line.trim()) return '';
               const indent = line.match(/^\s*/)[0].replace(/\t/g, '  ').length;
               const level = indent >= 4 ? 3 : (indent >= 2 ? 2 : 1);
               const t = line.trim().replace(/^[-•*]\s*/, '');
               return '<div class="b' + level + '">' + escapeHtml(t) + '</div>';
           }).join('');
       }

       // Appel à l'API Anthropic en streaming
       async function askClaude(question, target, block, context, forced) {
           const apiKey = document.getElementById('apiKey').value.trim();
           const jobDesc = document.getElementById('jobDescription').value.trim();
           const resume = document.getElementById('userResume').value.trim() || BUILT_IN_RESUME;

           if (!apiKey) {
               target.innerText = "⚠️ Please enter your Anthropic API key (top right).";
               return;
           }

           const systemPrompt =
               "LANGUAGE RULE: write your ENTIRE output in ENGLISH ONLY, whatever the language of the question, " +
               "the resume or the job description. Never answer in French. " +
               "You are a speaking coach helping a candidate during a live job interview conducted in English. " +
               "The candidate will READ YOUR ANSWER ALOUD, word for word, so it must sound natural when spoken. " +
               "STEP 1 (mandatory): the microphone may also pick up the candidate's own voice. Decide who is speaking. " +
               "If the utterance is spoken by the CANDIDATE (first-person statement about themselves, their background, " +
               "experience or skills, e.g. 'I have been a lawyer for 15 years', 'I worked at Goldman Sachs', 'in my " +
               "current role I...'), or contains no question or request addressed to the candidate, or is too short or " +
               "unintelligible, reply ONLY with: SKIP\n" +
               "Only write an answer if the utterance is a question, request or scenario from the interviewer " +
               "(recruiter or AI interviewer). When in doubt, reply SKIP. Never ask the candidate clarifying questions.\n" +
               "STEP 2: write the answer as 2 or 3 BULLET POINTS in English, first person, easy to read aloud live:\n" +
               "- Each bullet is ONE line starting with '- ' (no indentation, no sub-bullets).\n" +
               "- Each bullet contains 2 or 3 SHORT sentences (max 15 words each) that the candidate reads as is.\n" +
               "- Bullet 1 answers the question directly. Bullets 2 and 3 give the strongest concrete facts from the resume " +
               "(institutions, roles, regulations, results) linked to the job, and the last sentence ties back to the role.\n" +
               "- No paragraphs, no numbering, no markdown (no asterisks, no bold).\n" +
               "Example: '- I have been a financial lawyer for 15 years. I worked in London and Paris. This gave me both buy-side and sell-side expertise.'\n" +
               "Be fast and direct. Never invent experience that is not in the resume. Start directly with the first '- ' bullet, " +
               "no preamble, no title, no markdown (no asterisks, no bold).\n\n" +
               "=== JOB DESCRIPTION ===\n" + (jobDesc || "(not provided)") + "\n\n" +
               "=== CANDIDATE RESUME / SKILLS ===\n" + (resume || "(not provided)");

           try {
               const response = await fetch('https://api.anthropic.com/v1/messages', {
                   method: 'POST',
                   headers: {
                       'content-type': 'application/json',
                       'x-api-key': apiKey,
                       'anthropic-version': '2023-06-01',
                       'anthropic-dangerous-direct-browser-access': 'true'
                   },
                   body: JSON.stringify({
                       model: 'claude-haiku-5-5',
                       max_tokens: 1000,
                       thinking: { type: 'disabled' },
                       stream: true,
                       system: systemPrompt,
                       messages: [{ role: 'user', content:
                           (context && context.length ? "Utterances heard just before (context):\n- " + context.join("\n- ") + "\n\n" : "") +
                           "Utterance just heard:\n" + question + "\n\n(Answer in English only.)" +
                           (forced ? "\n\nCONFIRMED BY THE CANDIDATE: this utterance comes from the interviewer. Do not reply SKIP; write the answer." : "") }]
                   })
               });

               if (!response.ok) {
                   const err = await response.text();
                   target.innerText = "❌ API error (" + response.status + "): " + err;
                   return;
               }

               const reader = response.body.getReader();
               const decoder = new TextDecoder();
               let buffer = '';
               let text = '';
               let stopReason = '';
               target.innerText = '⏳ Claude is writing the answer...';

               while (true) {
                   const { done, value } = await reader.read();
                   if (done) break;
                   buffer += decoder.decode(value, { stream: true });
                   const lines = buffer.split('\n');
                   buffer = lines.pop();
                   for (const line of lines) {
                       if (!line.startsWith('data:')) continue;
                       const data = line.slice(5).trim();
                       if (!data) continue;
                       try {
                           const evt = JSON.parse(data);
                           if (evt.type === 'error') {
                               target.innerText = "❌ Claude error: " + (evt.error && evt.error.message ? evt.error.message : JSON.stringify(evt));
                               return;
                           }
                           if (evt.type === 'message_delta' && evt.delta && evt.delta.stop_reason) {
                               stopReason = evt.delta.stop_reason;
                           }
                           if (evt.type === 'content_block_delta' && evt.delta && evt.delta.text) {
                               text += evt.delta.text;
                               if ('SKIP'.startsWith(text.trim())) continue; // on attend de savoir si c'est un SKIP
                               if (text.trim().startsWith('SKIP')) continue;
                               target.innerHTML = renderPlan(text);
                           }
                       } catch (e) { /* ligne incomplète ignorée */ }
                   }
               }
               if (text.trim().startsWith('SKIP')) {
                   block.remove(); // Claude pense que c'est le candidat : on le montre en gris avec le bouton
                   showIgnored(question);
                   return;
               }
               if (!text) {
                   target.innerText = "⚠️ Claude returned no text (reason: " + (stopReason || "unknown") + "). Try again.";
               }
           } catch (e) {
               target.innerText = "❌ Network error: " + e.message;
           }
       }
   </script>
